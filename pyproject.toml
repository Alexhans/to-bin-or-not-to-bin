[project]
name = "binday"
version = "0.1.0"
description = "To bin or not to bin: one capability, from a coding agent to a Dag with no model in it"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["httpx>=0.27", "pydantic>=2"]

[project.scripts]
council = "binday.council.server:main"
airflow-up = "binday.airflow_up:main"

[project.optional-dependencies]
airflow = [
    "apache-airflow>=3.1",
    "apache-airflow-providers-common-ai[skills]>=1.0",
    "pydantic-ai-slim[anthropic,bedrock,openai]>=2.60",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binday"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -rs"
markers = ["agent: asks a model, so it is slower and costs something"]
